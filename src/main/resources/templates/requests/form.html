<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Place Blood Request')}"></head>
<body>

<div class="dashboard-container">
    <div th:replace="~{layout/base :: sidebar('requests')}"></div>
    
    <div class="main-wrapper">
        <header th:replace="~{layout/base :: navbar}"></header>
        
        <main class="main-content">
            <div class="mb-4">
                <a th:href="@{/requests}" class="text-decoration-none text-danger d-inline-flex align-items-center gap-1 mb-2">
                    <i class="bi bi-arrow-left"></i> Back to requests
                </a>
                <h2 class="m-0">Create Blood Request</h2>
                <p class="text-muted m-0">Place a new patient or hospital request for blood stock</p>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <form th:action="@{/requests/new}" th:object="${bloodRequest}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="patientName" class="form-label">Patient Full Name <span class="text-danger">*</span></label>
                            <input type="text" id="patientName" th:field="*{patientName}" class="form-control" th:classappend="${#fields.hasErrors('patientName')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:errors="*{patientName}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="hospital" class="form-label">Requesting Hospital <span class="text-danger">*</span></label>
                            <select id="hospital" th:field="*{hospital}" class="form-select" th:classappend="${#fields.hasErrors('hospital')} ? 'is-invalid' : ''" required>
                                <option value="">-- Select Hospital --</option>
                                <option th:each="h : ${hospitals}" th:value="${h.id}" th:text="${h.name}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{hospital}"></div>
                        </div>

                        <div class="col-md-3">
                            <label for="bloodGroup" class="form-label">Blood Group Required <span class="text-danger">*</span></label>
                            <select id="bloodGroup" th:field="*{bloodGroup}" class="form-select" th:classappend="${#fields.hasErrors('bloodGroup')} ? 'is-invalid' : ''" required>
                                <option value="">-- Select --</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{bloodGroup}"></div>
                        </div>

                        <div class="col-md-3">
                            <label for="unitsRequired" class="form-label">Units (Bags) Required <span class="text-danger">*</span></label>
                            <input type="number" id="unitsRequired" th:field="*{unitsRequired}" min="1" class="form-control" th:classappend="${#fields.hasErrors('unitsRequired')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:errors="*{unitsRequired}"></div>
                        </div>

                        <div class="col-md-3">
                            <label for="requiredByDate" class="form-label">Required By Date <span class="text-danger">*</span></label>
                            <input type="date" id="requiredByDate" th:field="*{requiredByDate}" class="form-control" th:classappend="${#fields.hasErrors('requiredByDate')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:errors="*{requiredByDate}"></div>
                        </div>

                        <div class="col-md-3">
                            <label for="urgency" class="form-label">Priority Level <span class="text-danger">*</span></label>
                            <select id="urgency" th:field="*{urgency}" class="form-select">
                                <option value="NORMAL">Normal Priority</option>
                                <option value="EMERGENCY">Emergency Priority (Red Alert)</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="notes" class="form-label">Clinical Indication / Diagnosis Notes</label>
                            <textarea id="notes" th:field="*{notes}" class="form-control" rows="3" placeholder="Describe patient medical indication (e.g. Scheduled Bypass, Severe Anemia)..."></textarea>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4 py-2">Submit Request</button>
                        <a th:href="@{/requests}" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/base :: footer}"></div>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Enforce min date is today
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        
        const dateInput = document.getElementById("requiredByDate");
        if (dateInput) {
            dateInput.min = `${yyyy}-${mm}-${dd}`;
        }
    });
</script>
</body>
</html>
