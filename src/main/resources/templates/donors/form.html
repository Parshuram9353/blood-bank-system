<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${donor.id == null ? 'Add Donor' : 'Edit Donor'})}"></head>
<body>

<div class="dashboard-container">
    <div th:replace="~{layout/base :: sidebar('donors')}"></div>
    
    <div class="main-wrapper">
        <header th:replace="~{layout/base :: navbar}"></header>
        
        <main class="main-content">
            <div class="mb-4">
                <a th:href="@{/donors}" class="text-decoration-none text-danger d-inline-flex align-items-center gap-1 mb-2">
                    <i class="bi bi-arrow-left"></i> Back to list
                </a>
                <h2 class="m-0" th:text="${donor.id == null ? 'Create Donor Profile' : 'Modify Donor Profile'}">Form Title</h2>
                <p class="text-muted m-0">Input donor personal and medical details below</p>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <form th:action="${donor.id == null} ? @{/donors/new} : @{/donors/edit/{id}(id=${donor.id})}" th:object="${donor}" method="post" class="needs-validation">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
                            <input type="text" id="firstName" th:field="*{firstName}" class="form-control" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{firstName}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Last Name <span class="text-danger">*</span></label>
                            <input type="text" id="lastName" th:field="*{lastName}" class="form-control" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{lastName}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                            <input type="email" id="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="contactNumber" class="form-label">Contact Number <span class="text-danger">*</span></label>
                            <input type="text" id="contactNumber" th:field="*{contactNumber}" class="form-control" th:classappend="${#fields.hasErrors('contactNumber')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{contactNumber}"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="bloodGroup" class="form-label">Blood Group <span class="text-danger">*</span></label>
                            <select id="bloodGroup" th:field="*{bloodGroup}" class="form-select" th:classappend="${#fields.hasErrors('bloodGroup')} ? 'is-invalid' : ''">
                                <option value="">-- Select --</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{bloodGroup}"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="dateOfBirth" class="form-label">Date of Birth <span class="text-danger">*</span></label>
                            <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" class="form-control" th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{dateOfBirth}"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="gender" class="form-label">Gender <span class="text-danger">*</span></label>
                            <select id="gender" th:field="*{gender}" class="form-select" th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid' : ''">
                                <option value="">-- Select --</option>
                                <option value="MALE">Male</option>
                                <option value="FEMALE">Female</option>
                                <option value="OTHER">Other</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{gender}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="lastDonationDate" class="form-label">Last Donation Date</label>
                            <input type="date" id="lastDonationDate" th:field="*{lastDonationDate}" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label for="eligibilityStatus" class="form-label">Eligibility override</label>
                            <select id="eligibilityStatus" th:field="*{eligibilityStatus}" class="form-select">
                                <option value="ELIGIBLE">Eligible</option>
                                <option value="DEFERRED">Deferred (Temporary restriction)</option>
                                <option value="INELIGIBLE">Ineligible (Permanent restriction)</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="address" class="form-label">Home Address <span class="text-danger">*</span></label>
                            <textarea id="address" th:field="*{address}" class="form-control" rows="3" th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:errors="*{address}"></div>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4 py-2">Save Profile</button>
                        <a th:href="@{/donors}" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
