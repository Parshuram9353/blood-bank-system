<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration - Blood Bank System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #fee2e2 0%, #f1f5f9 100%);
            min-height: 100vh;
            padding: 40px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            border: none;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            background: rgba(255, 255, 255, 0.95);
            max-width: 650px;
            width: 100%;
            overflow: hidden;
        }
        .register-header {
            background-color: var(--bg-sidebar);
            color: var(--text-light);
            padding: 24px;
            text-align: center;
        }
        .register-header i {
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 8px;
            display: inline-block;
        }
        .register-body {
            padding: 32px;
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="register-header">
        <i class="bi bi-heart-fill text-danger animate-pulse"></i>
        <h4>Donor Registration</h4>
        <p class="text-white-50 m-0">Create your account and donor profile to save lives</p>
    </div>
    
    <div class="register-body">
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form id="registerForm" th:action="@{/register}" th:object="${donorDto}" method="post">
            <h5 class="mb-3 text-muted border-bottom pb-2">Account Details</h5>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{username}"></div>
                </div>
                
                <div class="col-md-6">
                    <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
            </div>

            <h5 class="mb-3 text-muted border-bottom pb-2 mt-4">Personal Profile</h5>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
                    <input type="text" id="firstName" th:field="*{firstName}" class="form-control" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{firstName}"></div>
                </div>
                
                <div class="col-md-6">
                    <label for="lastName" class="form-label">Last Name <span class="text-danger">*</span></label>
                    <input type="text" id="lastName" th:field="*{lastName}" class="form-control" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{lastName}"></div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                
                <div class="col-md-6">
                    <label for="contactNumber" class="form-label">Contact Number <span class="text-danger">*</span></label>
                    <input type="text" id="contactNumber" th:field="*{contactNumber}" class="form-control" th:classappend="${#fields.hasErrors('contactNumber')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{contactNumber}"></div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="bloodGroup" class="form-label">Blood Group <span class="text-danger">*</span></label>
                    <select id="bloodGroup" th:field="*{bloodGroup}" class="form-select" th:classappend="${#fields.hasErrors('bloodGroup')} ? 'is-invalid' : ''">
                        <option value="">-- Select --</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{bloodGroup}"></div>
                </div>
                
                <div class="col-md-4">
                    <label for="dateOfBirth" class="form-label">Date of Birth <span class="text-danger">*</span></label>
                    <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" class="form-control" th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{dateOfBirth}"></div>
                </div>

                <div class="col-md-4">
                    <label for="gender" class="form-label">Gender <span class="text-danger">*</span></label>
                    <select id="gender" th:field="*{gender}" class="form-select" th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid' : ''">
                        <option value="">-- Select --</option>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="OTHER">Other</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{gender}"></div>
                </div>
            </div>

            <div class="mb-4">
                <label for="address" class="form-label">Residential Address <span class="text-danger">*</span></label>
                <textarea id="address" th:field="*{address}" class="form-control" rows="2" th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"></textarea>
                <div class="invalid-feedback" th:errors="*{address}"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-3 mb-3">Submit Registration</button>
        </form>
        
        <div class="text-center">
            <span class="text-muted">Already registered? </span>
            <a th:href="@{/login}" class="text-danger fw-semibold text-decoration-none">Login here</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
