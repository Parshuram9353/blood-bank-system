<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Blood Bank System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            max-width: 500px;
            width: 100%;
            background-color: white;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            padding: 40px;
            text-align: center;
            border-top: 5px solid var(--primary);
        }
        .error-icon {
            font-size: 64px;
            color: var(--primary);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="error-icon">
        <i class="bi bi-exclamation-octagon-fill"></i>
    </div>
    
    <h3 th:text="${errorTitle != null ? errorTitle : 'Access Denied / System Error'}">Error Title</h3>
    
    <p class="text-muted my-4" th:text="${errorMessage != null ? errorMessage : 'You do not have permission to access this page, or the requested resource does not exist.'}">
        Error description placeholder
    </p>

    <div class="mt-4 d-flex justify-content-center gap-3">
        <a th:href="@{/dashboard}" class="btn btn-primary d-flex align-items-center gap-2">
            <i class="bi bi-house"></i> Back to Home
        </a>
        <button onclick="history.back()" class="btn btn-outline-secondary d-flex align-items-center gap-2">
            <i class="bi bi-arrow-left"></i> Go Back
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
